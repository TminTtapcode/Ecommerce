spring:
  # Local-only convenience: .env is ignored by Git and may supply sandbox credentials.
  # Deployment environments still provide the same variables through their secret manager.
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true # In câu lệnh SQL ra console để dễ debug
    properties:
      hibernate:
        format_sql: true # Format câu SQL cho đẹp dễ đọc
        highlight_sql: true
    hibernate:
      ddl-auto: update
    naming:
      physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

  mail:
      host: smtp.gmail.com
      port: 587
      username: ${MAIL_USERNAME}
      password: ${MAIL_PASSWORD}

      properties:
        mail:
          smtp:
            auth: true
            starttls:
              enable: true
# Khối application phải nằm sát lề trái, ngang hàng với spring
application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      expiration: 86400000
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}

app:
  frontend:
    url: http://localhost:5173

payment:
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE}
    secret-key: ${VNPAY_SECRET_KEY}
    pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
    # Sandbox-only transaction endpoint for QueryDR/refund. Do not add a production endpoint here.
    api-url: ${VNPAY_SANDBOX_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
    version: "2.1.0"
    # Public/server IP supplied by the deployment environment for VNPay WebAPI requests.
    api-ip: ${VNPAY_API_IP}
    return-url: http://localhost:5173/payment-result
